plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barbelldiva.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.barbelldiva.app"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "1.3.0"
    }

    // Firma di release: la password arriva dalla variabile d'ambiente
    // BD_KEYSTORE_PASS (mai scritta nel repo).
    signingConfigs {
        release {
            storeFile file("../keystore.jks")
            storePassword System.getenv("BD_KEYSTORE_PASS")
            keyAlias "barbelldiva"
            keyPassword System.getenv("BD_KEYSTORE_PASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // v1.3.0 — niente piu' TWA (libreria browser-helper rimossa): WebView propria.
    // appcompat serve al tema (Theme.AppCompat.NoActionBar), prima arrivava
    // in modo transitivo dalla libreria TWA. webkit fornisce
    // addDocumentStartJavaScript (shim navigator.wakeLock).
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    // Allinea kotlin-stdlib / -jdk7 / -jdk8 (classi duplicate altrimenti).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
