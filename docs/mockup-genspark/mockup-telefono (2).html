<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbell Diva Telefono</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* ===== Palette presa dal mockup di Codex ===== */
body[data-theme="dark"]{--bg-main:#070817;--bg2:#0d0d24;--surface:#15152f;--raised:#211b3e;--text:#fff8fd;--muted:#cbbbd7;--dim:#927fa3;--line:rgba(202,107,225,.24);--pink:#ff4fa3;--pink2:#ff80c1;--lav:#c9a7ff;--green:#7be0a8;--cardA:#251b31;--cardB:#1d1627;--field:#17111f;--chip:#191321;--hdr:rgba(8,8,25,.5);--nav:#0d0d24ee;--navtxt:#9586a2;--navon:#ff8dc3;--btn2:#30233c;--round:rgba(38,27,58,.88);--roundtxt:#ff66ac;--bubble:#fff8ff;--bubbleTxt:#291a34;--bubbleB:#ff4fa3;--phoneShadow:0 0 0 7px #08060b,0 0 0 8px #342640,0 20px 50px #07040c99;
 background:radial-gradient(circle at 12% 5%,rgba(143,53,236,.16),transparent 27%),radial-gradient(circle at 88% 16%,rgba(247,37,133,.12),transparent 27%),linear-gradient(145deg,#050612,#0b0b20 52%,#080719);color:var(--text)}
body[data-theme="light"]{--bg-main:#c9a9e8;--bg2:#eadcf7;--surface:#fffafd;--raised:#f8eafa;--text:#241238;--muted:#705b82;--dim:#88749a;--line:rgba(105,55,145,.18);--pink:#ff4fa3;--pink2:#b01b6b;--lav:#7c2bd1;--green:#237350;--cardA:#fffafd;--cardB:#f8eafa;--field:#fffafd;--chip:#fffafd;--hdr:rgba(247,237,250,.72);--nav:#eadcf7ee;--navtxt:#705b82;--navon:#8b2868;--btn2:#f5eafa;--round:rgba(255,255,255,.6);--roundtxt:#7c2bd1;--bubble:#fffafd;--bubbleTxt:#291a34;--bubbleB:#c9a7ff;--phoneShadow:0 0 0 7px #f7eefa,0 0 0 8px #b899d1,0 20px 50px #4e256f2e;
 background:radial-gradient(circle at 8% 4%,rgba(104,49,174,.34),transparent 28%),radial-gradient(circle at 88% 14%,rgba(255,162,213,.42),transparent 30%),linear-gradient(135deg,#a985d4,#cfafe8 42%,#e7c9e8 72%,#b897db);color:var(--text)}
body{font-family:Inter,ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;padding:30px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:26px}
h1.t{font-size:13px;font-weight:700;color:var(--muted);text-align:center;max-width:560px;line-height:1.5}
.tt{position:fixed;top:12px;right:12px;z-index:50;border:1px solid var(--line);background:var(--round);color:var(--roundtxt);border-radius:99px;height:38px;padding:0 14px;font:800 13px inherit;cursor:pointer;backdrop-filter:blur(8px)}
.grid{display:flex;flex-wrap:wrap;gap:40px 34px;justify-content:center;align-items:flex-start;max-width:1500px}
.board>h2{font-size:12px;font-weight:800;margin-bottom:10px;color:var(--muted);text-align:center;letter-spacing:.04em}

/* ===== telefono ===== */
.phone{width:390px;height:820px;border-radius:38px;background:var(--bg2);box-shadow:var(--phoneShadow);overflow:hidden;position:relative;display:grid;grid-template-rows:27px auto 1fr;isolation:isolate}
.status{padding:8px 22px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted)}
.top{min-height:62px;padding:8px 16px 10px;display:flex;justify-content:space-between;align-items:center;background:var(--hdr);border-bottom:1px solid rgba(255,81,166,.17)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,#a855f7,#ff4fa3);overflow:hidden;box-shadow:0 5px 17px #ff4fa333;flex:none}
.mark svg{width:100%;height:100%;display:block}
.brand b{display:block;font-size:16px;font-weight:850;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.acts{display:flex;gap:6px}
.rb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--round);color:var(--roundtxt);border:1px solid rgba(211,113,232,.2);font-size:14px;font-weight:800;box-shadow:0 8px 22px #0003}
.screen{overflow-y:auto;padding:16px 16px 100px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none;
 background:linear-gradient(135deg,rgba(255,111,203,.14),transparent 34%),linear-gradient(225deg,rgba(169,144,255,.14),transparent 42%),var(--bg2)}
.screen::-webkit-scrollbar{display:none}
.screen>*{flex-shrink:0}
.nav{position:absolute;bottom:0;left:0;right:0;height:70px;background:var(--nav);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px;z-index:6}
.nav div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--navtxt);border-radius:12px}
.nav div.on{color:var(--navon);background:#ff4fa31a}
.nav svg{width:21px;height:21px}

/* ===== componenti ===== */
.card{background:linear-gradient(145deg,var(--cardA),var(--cardB));border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 22px #07040c22;display:flex;flex-direction:column;gap:10px}
.card.soft{background:var(--surface)}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ch h2,.ch h3{font-size:14px;font-weight:800}
.sub{font-size:11px;color:var(--muted);line-height:1.45}
.pill{font-size:10px;font-weight:800;color:var(--lav);border:1px solid #c9a7ff44;background:#c9a7ff12;padding:5px 9px;border-radius:99px;white-space:nowrap}
.pill.pink{color:var(--pink2);border-color:#ff4fa344;background:#ff4fa312}
.pill.ok{color:var(--green);border-color:#7be0a844;background:#7be0a812}
.pill.warn{color:#ffb454;border-color:#ffb45455;background:#ffb4541a}
.eyebrow{color:var(--pink2);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.13em}
.greet{display:flex;justify-content:space-between;align-items:end}
.greet h1{font-size:25px;line-height:1.1;letter-spacing:-.03em;margin-top:5px}
.greet .d{font-size:11px;color:var(--muted);text-align:right}
.btn{width:100%;border:0;border-radius:14px;padding:13px 14px;background:linear-gradient(100deg,#ff4fa3,#da5dd1);color:#190c1c;font:900 13px inherit;box-shadow:0 7px 20px #ff4fa329;cursor:pointer}
.btn.sec{background:var(--btn2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.out{background:transparent;border:1.5px solid #ff9a3d;color:#ff9a3d;box-shadow:none}
.row{display:flex;gap:8px}.row>*{flex:1}
.lr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #ffffff0c}
.lr:first-of-type{border-top:0}
.lr b{font-size:12px}.lr small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.ar{color:var(--lav);font-size:18px}
.prog{height:7px;border-radius:9px;background:#40354b55;overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pink),var(--lav))}
.tabs{display:flex;gap:6px;padding:4px;background:var(--field);border:1px solid var(--line);border-radius:14px}
.tabs div{flex:1;text-align:center;font-size:12px;font-weight:800;padding:10px 4px;border-radius:10px;color:var(--muted)}
.tabs div.on{background:linear-gradient(90deg,#ff4fa3,#c35be0);color:#190c1c}
.mood{display:flex;gap:8px}
.mood button{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:14px;color:var(--muted);padding:10px 3px;font:700 10px inherit;cursor:pointer}
.mood button span{display:block;font-size:20px;margin-bottom:5px}
.mood button.on{border-color:var(--pink);background:#ff4fa315;color:var(--text)}
.ring{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pink) 0 77%,#4a385955 77% 100%);position:relative;flex:none}
.ring:before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font-size:19px;font-weight:900}
.readiness{display:grid;grid-template-columns:74px 1fr;gap:14px;align-items:center;flex-direction:row}
.sub3{display:flex;gap:14px;margin-top:8px}
.sub3 div{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sub3 b{display:block;font-size:16px;color:var(--text);margin-top:2px;letter-spacing:0}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric{border-radius:16px;border:1px solid var(--line);background:var(--chip);padding:12px}
.metric label{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.metric b{display:block;font-size:19px;margin-top:6px}.metric em{font-style:normal;font-size:10px;color:var(--muted)}
.hd{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pink2);display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.in{height:42px;border-radius:12px;background:var(--field);border:1px solid var(--line);padding:0 12px;display:flex;align-items:center;color:var(--muted);font-size:13px;font-weight:700}
.in.v{color:var(--text)}
.f2{display:flex;gap:10px}.f2>div{flex:1}
.q5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.q5 div{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center;font-size:9.5px;font-weight:700;color:var(--muted)}
.q5 div span{display:block;font-size:18px}.q5 div.on{border-color:var(--pink);color:var(--text)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;flex-direction:row}
.macros b{display:block;font-size:18px}.macros span{font-size:10px;color:var(--muted)}
.dots{display:flex;justify-content:space-between}
.dots div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;color:var(--muted);font-weight:700}
.dots i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;background:var(--chip);border:1.5px solid var(--line);color:var(--muted)}
.dots i.done{background:linear-gradient(135deg,#ff4fa3,#a855f7);color:#190c1c;border:0}
.dots i.now{border:2px solid var(--pink);color:var(--text)}
.phases{display:flex;gap:3px}.phases i{flex:1;height:8px;border-radius:4px;background:var(--chip);border:1px solid var(--line)}
.phases i.on{background:linear-gradient(90deg,#ff4fa3,#a855f7);border:0}
.note{font-size:10px;color:var(--muted);line-height:1.5;background:#c9a7ff12;border-left:2px solid var(--lav);padding:9px 10px;border-radius:0 9px 9px 0}
.foot{text-align:center;color:var(--dim);font-size:9.5px}

/* ===== workout ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips div{padding:10px 16px;border-radius:12px;background:var(--chip);border:1px solid var(--line);font-size:13px;font-weight:800;position:relative}
.chips div.on{background:linear-gradient(90deg,#ff4fa3,#c35be0);color:#190c1c;border:0}
.chips div i{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.weeks div{text-align:center;padding:9px 0;border-radius:10px;font-size:11px;font-weight:800;background:var(--chip);border:1px solid var(--line);color:var(--muted)}
.weeks div.on{background:linear-gradient(90deg,#ff4fa3,#c35be0);color:#190c1c;border:0}
.pg{display:grid;grid-template-columns:18px repeat(8,1fr) 36px;gap:4px;align-items:center;font-size:9.5px;font-weight:800;color:var(--muted)}
.pg b{width:18px;height:18px;border-radius:5px;background:#ff4fa31f;color:var(--pink2);display:grid;place-items:center;font-size:10px}
.pg i{font-style:normal;text-align:center;padding:4px 0;border-radius:6px;background:var(--chip);border:1px solid var(--line)}
.pg i.d{background:#ff4fa31f;color:var(--pink2);border-color:#ff4fa355}
.pg i.n{border-color:var(--pink);color:var(--text)}
.pg span{text-align:right;font-size:8.5px;color:var(--dim)}
.seg{display:flex;padding:4px;background:var(--field);border:1px solid var(--line);border-radius:12px}
.seg div{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:12px;font-weight:800;color:var(--muted)}
.seg div.on{background:linear-gradient(90deg,#ff4fa3,#c35be0);color:#190c1c}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{width:42px;height:24px;border-radius:14px;background:#5b4c6877;position:relative;flex:none}
.sw:after{content:"";position:absolute;height:18px;width:18px;border-radius:50%;background:#fff;left:3px;top:3px}
.sw.on{background:#aa54bd}.sw.on:after{left:21px}
.car{display:flex;align-items:center;justify-content:space-between}
.car .ab{width:34px;height:34px;border-radius:11px;background:var(--chip);border:1px solid var(--line);display:grid;place-items:center;color:var(--lav);font-weight:800}
.car .ab.d{opacity:.35}
.car .c{text-align:center}.car .c b{font-size:16px}.car .c small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.cd{display:flex;gap:5px;justify-content:center}.cd i{width:7px;height:7px;border-radius:50%;background:var(--line)}.cd i.on{width:20px;border-radius:5px;background:var(--pink)}
.rx{display:flex;flex-direction:column;gap:10px}
.rx .l{display:flex;justify-content:space-between;align-items:baseline}
.rx .l small{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.rx .l b{font-size:21px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri div{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:10px;text-align:center}
.tri small{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.tri b{font-size:18px}
.desc small{font-size:9.5px;letter-spacing:.1em;font-weight:800;color:var(--muted)}
.desc p{font-size:12px;color:var(--text);margin-top:5px;line-height:1.45}
.pills{display:flex;gap:8px}
.pills div{flex:1;text-align:center;padding:9px 6px;border-radius:11px;background:var(--chip);border:1px solid var(--line);font-size:11px;font-weight:800}
.setblk{border-left:3px solid #a855f7;padding-left:11px;display:flex;flex-direction:column;gap:7px}
.setblk.b{border-color:#5b8cff}
.setblk h4{font-size:12px;color:#b27cff}.setblk.b h4{color:#7aa2ff}
.setblk small{font-size:10px;color:var(--muted)}
.sr{display:grid;grid-template-columns:24px 1fr 14px 1fr;gap:8px;align-items:center;font-size:11px;font-weight:800;color:var(--muted)}
.sr .in{justify-content:center;color:var(--text);font-size:15px}
.up{font-size:10px;font-weight:800;color:#ffb454;margin:-2px 0 0 32px}
.add{align-self:flex-start;padding:7px 12px;border-radius:10px;background:var(--chip);border:1px solid var(--line);font-size:11px;font-weight:800}
.timer{border:2px solid #ff9a3d;border-radius:22px;padding:18px;text-align:center;background:linear-gradient(160deg,rgba(255,154,61,.14),rgba(255,154,61,.02));display:flex;flex-direction:column;gap:12px}
.timer small{font-size:11px;letter-spacing:.2em;font-weight:800;color:#ff9a3d}
.timer .big{font-size:64px;font-weight:900;color:#ff9a3d;line-height:1;letter-spacing:-.02em}
.timer .bar{height:7px;border-radius:5px;background:#ff9a3d;box-shadow:0 0 10px #ff9a3d77}
.btn.or{background:#ff9a3d;color:#241238;box-shadow:0 7px 20px #ff9a3d33}
.mo{position:absolute;inset:0;background:rgba(5,5,18,.62);backdrop-filter:blur(2px);z-index:8;display:flex;align-items:center;padding:20px}
body[data-theme="light"] .mo{background:rgba(60,30,90,.4)}
.modal{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px #0007}
.modal h3{font-size:18px;color:var(--pink2)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.rate div{padding:11px 0;text-align:center;border-radius:11px;border:1px solid var(--line);background:var(--chip);font-weight:800;font-size:13px}
.rate div.on{border-color:var(--pink);background:#ff4fa31c}
.ta{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--field);padding:11px;font-size:12px;color:var(--muted)}
.lg{border:1px solid var(--line);background:var(--chip);border-radius:16px;padding:13px;display:flex;gap:12px;align-items:center}
.lg .dt{width:46px;text-align:center;flex:none}.lg .dt b{display:block;font-size:20px;line-height:1}.lg .dt small{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lg .mid{flex:1;display:flex;flex-direction:column;gap:5px}.lg .mid b{font-size:13px}
.lg .mid .tags{display:flex;gap:5px;flex-wrap:wrap}.lg .mid .tags span{font-size:9.5px;padding:3px 7px;border-radius:99px;background:#c9a7ff14;border:1px solid #c9a7ff33;color:var(--muted);font-weight:700}
.trash{width:38px;height:38px;border-radius:12px;border:1px solid #ff6b8a55;background:#ff6b8a14;color:#ff6b8a;display:grid;place-items:center;cursor:pointer;flex:none}
.trash svg{width:18px;height:18px}
.lg.gone{display:none}

/* ===== robottina ===== */
.hero{position:relative;overflow:hidden;padding:16px 16px 4px}
.herobox{display:flex;align-items:flex-end;gap:6px;min-height:220px}
.bubble{position:relative;background:var(--bubble);color:var(--bubbleTxt);border:2px solid var(--bubbleB);border-radius:18px 18px 18px 6px;padding:10px 12px;font-size:12.5px;font-weight:700;line-height:1.35;max-width:178px;align-self:flex-start;margin-top:6px;box-shadow:0 4px 14px rgba(255,79,163,.22)}
.bubble:after{content:"";position:absolute;right:-8px;bottom:14px;width:13px;height:13px;background:var(--bubble);border-right:2px solid var(--bubbleB);border-top:2px solid var(--bubbleB);transform:rotate(45deg)}
.bubble small{display:block;font-size:10.5px;color:#8a6b82;font-weight:600;margin-top:3px}
.bot{width:150px;flex:none;margin-left:auto;animation:bob 3.2s ease-in-out infinite}
.bot svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes bob{50%{transform:translateY(-4px)}}
.sbot{position:absolute;right:8px;bottom:76px;width:78px;z-index:5;pointer-events:none;filter:drop-shadow(0 6px 10px #0006)}
.sbot svg{display:block;width:100%;height:auto;overflow:visible}
.sbub{position:absolute;right:82px;bottom:104px;width:170px;background:var(--bubble);color:var(--bubbleTxt);border:2px solid var(--bubbleB);border-radius:16px 16px 4px 16px;padding:9px 11px;font-size:11px;font-weight:700;line-height:1.35;z-index:5;box-shadow:0 8px 22px #0005}
.sbub:after{content:"";position:absolute;right:-7px;bottom:10px;width:11px;height:11px;background:var(--bubble);border-right:2px solid var(--bubbleB);border-top:2px solid var(--bubbleB);transform:rotate(45deg)}
.strip{display:flex;align-items:flex-end;gap:10px;margin:-2px 0}
.strip .sb{position:relative;flex:1;background:var(--bubble);color:var(--bubbleTxt);border:2px solid var(--bubbleB);border-radius:16px 16px 4px 16px;padding:9px 12px;font-size:12px;font-weight:700;line-height:1.35;margin-bottom:10px;box-shadow:0 4px 14px rgba(255,79,163,.18)}
.strip .sb:after{content:"";position:absolute;right:-7px;bottom:10px;width:11px;height:11px;background:var(--bubble);border-right:2px solid var(--bubbleB);border-top:2px solid var(--bubbleB);transform:rotate(45deg)}
.strip .sbt{width:64px;flex:none}.strip .sbt svg{display:block;width:100%;height:auto;overflow:visible}
.cele{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.cele .bot{width:112px;margin:0;animation:none;position:relative;z-index:2}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:22px}
.conf i{position:absolute;width:7px;height:12px;border-radius:2px;opacity:.9}
.xs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;width:min(820px,92vw)}
.ex{background:linear-gradient(145deg,var(--cardA),var(--cardB));border:1px solid var(--line);border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.ex .bot{width:92px;margin:0;animation:none}
.ex .bubble{align-self:center;max-width:none;margin:0 0 6px;font-size:11px;text-align:center}
.ex .bubble:after{right:auto;left:50%;bottom:-8px;margin-left:-6px;border:0;border-right:2px solid var(--bubbleB);border-bottom:2px solid var(--bubbleB)}

function tgl(){const b=document.body,l=b.dataset.theme==='dark';b.dataset.theme=l?'light':'dark';document.getElementById('tt').textContent=l?'☾ Tema scuro':'☀ Tema chiaro'}

/* ---------- Coda di sincronizzazione: i dati del telefono arrivano sul PC, niente si perde ---------- */
let CODA=[];try{CODA=JSON.parse(localStorage.getItem('bd-coda')||'[]')||[]}catch(e){CODA=[]}
const salvaCoda=()=>{try{localStorage.setItem('bd-coda',JSON.stringify(CODA))}catch(e){}}
function accoda(tipo,dettaglio){
 CODA.push({tipo:tipo,dettaglio:dettaglio,dt:new Date().toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})});
 salvaCoda();dipinti();toast('💾 «'+tipo+'» in coda: partirà con la prossima sincronizzazione');
}
function dipinti(){
 document.querySelectorAll('[data-coda-n]').forEach(el=>el.textContent=CODA.length);
 document.querySelectorAll('[data-coda-pill]').forEach(el=>{el.textContent=CODA.length?('In attesa: '+CODA.length):'Tutto aggiornato';el.classList.toggle('ok',!CODA.length)});
 document.querySelectorAll('[data-coda-lista]').forEach(el=>{el.innerHTML=CODA.length?CODA.map(i=>'<div class="srow"><div class="t">'+i.tipo+'<small>'+i.dettaglio+' · salvato '+i.dt+'</small></div><span class="pill pink">☁ in coda</span></div>').join(''):''});
 document.querySelectorAll('.cloud').forEach(c=>c.classList.toggle('has',CODA.length>0));
}
function sincronizza(btn){
 if(!CODA.length){toast('✓ Tutto già sincronizzato con il PC');return}
 if(btn){btn.disabled=true;const o=btn.textContent;btn.textContent='☁ Invio al PC…';
  setTimeout(()=>{CODA=[];salvaCoda();dipinti();btn.disabled=false;btn.textContent=o;
   document.querySelectorAll('[data-ultimo]').forEach(el=>el.textContent='Ultimo invio: adesso');
   toast('🎉 Tutti i dati sono arrivati sul PC · niente si perde');},900);
 } else {CODA=[];salvaCoda();dipinti();}
}
function toast(msg){
 let t=document.querySelector('.toast');
 if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}
 t.textContent=msg;t.classList.add('on');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('on'),2600);
}

 const up=(x==='happy'||x==='cele');const ARMS=`<g transform="rotate(${A[0]} 68 177)"><circle class="jt" cx="68" cy="177" r="12"/><path class="sh" d="M64 172c-15 1-24 12-25 26-1 11 6 18 15 15 8-3 12-13 14-27Z"/><circle class="jt" cx="47" cy="208" r="9"/></g>
 <g transform="rotate(${A[1]} 172 177)"><circle class="jt" cx="172" cy="177" r="12"/><path class="sh" d="M176 172c15 1 24 12 25 26 1 11-6 18-15 15-8-3-12-13-14-27Z"/><circle class="jt" cx="193" cy="208" r="9"/></g>`;
 const vb=o.head?'44 58 152 112':'0 18 240 256';
 return `<svg viewBox="${vb}" aria-hidden="true"><style>.fs{fill:none;stroke:#ff9ad5;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.sh{fill:#fdfbff;stroke:#b9a6d0;stroke-width:3}.jt{fill:#efe6f7;stroke:#b9a6d0;stroke-width:3}</style>
 ${o.head?'':'<ellipse cx="120" cy="268" rx="62" ry="6" fill="#000" opacity=".18"/>'}
 <path d="M120 49V31" fill="none" stroke="#c7b8d8" stroke-width="7" stroke-linecap="round"/><path d="M120 29c-13-15-30 4 0 23 30-19 13-38 0-23Z" fill="#ff72c2" stroke="#ffe1f4" stroke-width="3"/>
 ${o.head?'':`<path class="sh" d="M92 226h24v32q0 8-8 8H86q-8 0-8-8 0-6 8-8l6-4Z"/><path class="sh" d="M148 226h-24v32q0 8 8 8h22q8 0 8-8 0-6-8-8l-6-4Z"/><path d="M82 258h30M128 258h30" stroke="#ff72c2" stroke-width="4" stroke-linecap="round"/>
${up?"":ARMS}
 <path class="sh" d="M76 164c10-14 78-14 88 0l-7 68c-13 16-61 16-74 0Z"/><path d="M86 176h68l-5 42c-13 11-45 11-58 0Z" fill="#ded5e9" stroke="#9f87bb" stroke-width="3"/><path d="M120 189c-10-12-24 3 0 20 24-17 10-32 0-20Z" fill="#ff72c2"/>`}
 <path class="sh" d="M45 73c15-27 135-27 150 0 12 20 12 72-3 91-21 27-123 27-144 0-15-19-15-71-3-91Z"/>
 <path d="M41 96c-16 5-18 44-1 51m159-51c16 5 18 44 1 51" fill="#efe6f7" stroke="#ff72c2" stroke-width="7" stroke-linecap="round"/>
 <rect x="57" y="83" width="126" height="77" rx="31" fill="#241a2e"/><path d="M75 92c20-8 67-10 91 0-37 1-68 8-92 22-5-8-4-16 1-22Z" fill="#3a2a4a" opacity=".65"/>${F}${up&&!o.head?ARMS:''}</svg>`}

 const p=v.map((y,i)=>[8+i*(w-16)/(v.length-1),h-14-(y-mn)/(mx-mn)*(h-30)]),d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
 return `<svg viewBox="0 0 ${w} ${h}" width="100%"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF4FA3" stop-opacity=".35"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></linearGradient></defs><path d="${d}L${p[p.length-1][0]} ${h-6}L${p[0][0]} ${h-6}Z" fill="url(#g${id})"/><path d="${d}" fill="none" stroke="#ff4fa3" stroke-width="2.5" stroke-linejoin="round"/>${p.filter((_,i)=>i%4===0||i===p.length-1).map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--bg2)" stroke="#ff4fa3" stroke-width="2"/>`).join('')}</svg>`}
