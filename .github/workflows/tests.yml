name: App smoke test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check runtime files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f app-config-v144.js
          test -f workout-flow-v147.js
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Check Intensita nuovo and sync repair are embedded
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          for (const required of ['Intensità Agosto-Ottobre', 'intensitaNuovoBuild', '2026-08-31-sync-notes-v7-cloud-repair', 'synchronizeReliableNow', 'programModelCache.clear', 'Programma salvato e sincronizzato']) {
            if (!html.includes(required)) throw new Error(`Missing: ${required}`);
          }
          console.log('Barbell Diva runtime, notes and sync repair: OK');
          NODE
